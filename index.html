.sec .sub{position:absolute;left:64px;top:170px;font-size:30px;font-weight:600;color:var(--mute)}
.it{position:absolute;border-radius:18px;overflow:hidden;background:var(--canvas);cursor:zoom-in;outline:1px solid var(--line)}
.it img,.it video{width:100%;height:100%;object-fit:cover;display:block}
.it.svg{display:flex;align-items:center;justify-content:center}
.it.svg img{width:68%;height:68%;object-fit:contain}
.it .vb{position:absolute;right:14px;top:14px;font:900 22px "BD",sans-serif;text-transform:uppercase;background:#ff4005;color:#fff;border-radius:999px;padding:6px 16px}
.farben{display:grid;grid-template-columns:repeat(6,1fr);height:100%}
.farben div{display:flex;flex-direction:column;justify-content:flex-end;padding:22px;font:600 24px "BT",sans-serif;gap:6px}
.farben b{font:900 38px/1 "BD",sans-serif;text-transform:uppercase;letter-spacing:-.01em}

#lb .cap{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;color:#fcfaf7;font-size:13px}
#lb .cap a{color:#fde233;margin-left:10px}

/* Aufbau: Bereiche als Rahmen, darin Spalten, immer in die kürzeste Spalte legen */
var x = 0, y = 0, rowH = 0;

    var c = 0, top = Infinity;

    placed.push({it: it, x: c * (colw + GAP), y: top, w: w, h: h});
    for (var j = c; j < c + span; j++) heights[j] = top + h + GAP;
  });
